<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Command Center</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171c23;
    --panel-2: #1e242d;
    --line: #2a323d;
    --text: #e8edf3;
    --muted: #93a0b0;
    --accent: #4f9cf9;
    --good: #35c06d;
    --bad: #e8544a;
    --warn: #e0a634;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f7fa; --panel: #ffffff; --panel-2: #eef2f7; --line: #d9e0e8;
      --text: #151a20; --muted: #5b6b7c; --accent: #1f6fd0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 18px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  nav button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-size: 14px;
  }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 20px 0 60px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  /* Trend chart. Series colors follow a validated categorical order
     (blend, actual, ESPN, model); dark steps are chosen for the dark panel. */
  .viz-root {
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --grid: #2a323d;
  }
  @media (prefers-color-scheme: light) {
    .viz-root {
      --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
      --grid: #e3e8ee;
    }
  }
  .viz-root svg { display: block; width: 100%; height: auto; overflow: visible; }
  .viz-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
  .viz-legend .key { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .viz-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
  .viz-tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--text); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .viz-tip .row { display: flex; gap: 8px; justify-content: space-between; }
  .clickable { cursor: pointer; }
  .player-link { color: var(--text); text-decoration: none; }
  .player-link:hover { text-decoration: underline; color: var(--accent); }
  .matchup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .matchup-grid { grid-template-columns: 1fr; } }
  .week-row.selected { background: var(--panel-2); }
  .winbar { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: var(--line);
    vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .winbar span { display: block; height: 100%; background: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
  .chip { background: var(--panel-2); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  .stat { flex: 1 1 150px; background: var(--panel-2); border-radius: var(--radius); padding: 12px; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:hover { background: var(--panel-2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pos { display: inline-block; min-width: 38px; padding: 1px 6px; border-radius: 6px;
         background: var(--panel-2); font-size: 12px; text-align: center; }
  .starter { color: var(--text); }
  .bench { color: var(--muted); }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }
  button.action {
    background: var(--accent); color: #fff; border: 0; padding: 9px 16px;
    border-radius: var(--radius); cursor: pointer; font-size: 14px;
  }
  button.action:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.small { padding: 5px 10px; font-size: 13px; }
  input, select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; font-size: 14px;
  }
  input[type="number"] { width: 84px; }
  .notice { padding: 12px 14px; border-radius: var(--radius); margin-bottom: 14px; }
  .notice.err { background: rgba(232,84,74,.14); border: 1px solid var(--bad); }
  .notice.ok { background: rgba(53,192,109,.14); border: 1px solid var(--good); }
  .muted { color: var(--muted); }
  pre { background: var(--panel-2); padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; }
  .hidden { display: none; }
  .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .subtabs button { background: transparent; border: 1px solid var(--line); color: var(--text);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  .subtabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .chip.ok { border-color: var(--good); }
  .chip.off { border-color: var(--bad); color: var(--muted); }
  .note { font-size: 12px; }
  .bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  @media (max-width: 640px) {
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 id="league-name">Fantasy Command Center</h1>
    <div class="sub" id="league-sub">Loading league…</div>
    <nav>
      <button data-tab="team" class="active">My Team</button>
      <button data-tab="season">Season</button>
      <button data-tab="players">Players</button>
      <button data-tab="waivers">Waiver Wire</button>
      <button data-tab="news">News</button>
      <button data-tab="value">Value</button>
      <button data-tab="trends">Trends</button>
      <button data-tab="scout">Scout Opponent</button>
      <button data-tab="league">League</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="global-error" class="notice err hidden"></div>

  <section id="tab-team"></section>
  <section id="tab-season" class="hidden"></section>
  <section id="tab-players" class="hidden"></section>
  <section id="tab-waivers" class="hidden"></section>
  <section id="tab-news" class="hidden"></section>
  <section id="tab-value" class="hidden"></section>
  <section id="tab-trends" class="hidden"></section>
  <section id="tab-scout" class="hidden"></section>
  <section id="tab-league" class="hidden"></section>
</main>

<script>
const state = { config: null, league: null, week: null, objective: "points" };

// Small helpers for building DOM without a framework.
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key === "html") node.innerHTML = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== null && value !== undefined) node.setAttribute(key, value);
  }
  for (const child of [].concat(children)) {
    if (child === null || child === undefined) continue;
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

function fmt(n, digits = 1) {
  if (n === null || n === undefined) return "-";
  return Number(n).toFixed(digits);
}

function signed(n, digits = 2) {
  const value = Number(n || 0);
  return (value >= 0 ? "+" : "") + value.toFixed(digits);
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const text = await response.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
  if (!response.ok) {
    const detail = data.detail || data.error || `HTTP ${response.status}`;
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail, null, 2));
  }
  return data;
}

function showError(message) {
  const box = document.getElementById("global-error");
  box.textContent = message;
  box.classList.remove("hidden");
}

function clearError() {
  document.getElementById("global-error").classList.add("hidden");
}

function statusLabel(player) {
  if (player.on_bye) return el("span", { class: "warn" }, "BYE");
  if (player.injury_status_raw && player.injury_status_raw !== "ACTIVE" && player.injury_status_raw !== "NORMAL") {
    const bad = ["OUT", "INJURY_RESERVE", "SUSPENSION", "DOUBTFUL"].includes(player.injury_status_raw);
    return el("span", { class: bad ? "bad" : "warn" }, player.injury_status);
  }
  return el("span", { class: "muted" }, "—");
}

// A projection cell. With the multi-source consensus on, the number is the
// blend; hover shows each source, and a small note flags where the blend
// has moved well away from ESPN's own number.
const SOURCE_NAMES = { espn: "ESPN", sleeper: "Sleeper", fantasypros: "FantasyPros" };

function projCell(player, value) {
  const shown = value != null ? value : player.projected_points;
  const sources = player.source_points || {};
  const names = Object.keys(sources);
  if (names.length < 2) return el("td", { class: "num" }, fmt(shown, 1));

  const title = names.map(s => `${SOURCE_NAMES[s] || s} ${fmt(sources[s], 1)}`).join(" · ");
  const gap = player.consensus_points - player.espn_projected_points;
  const note = Math.abs(gap) >= 2
    ? el("span", { class: "muted", style: "font-size:11px;margin-left:4px" },
        `ESPN ${fmt(player.espn_projected_points, 1)}`)
    : "";
  return el("td", { class: "num", title }, [fmt(shown, 1), note]);
}

function table(headers, rows) {
  return el("table", {}, [
    el("thead", {}, el("tr", {}, headers.map(h =>
      el("th", { class: h.num ? "num" : (h.hide ? "hide-sm" : "") }, h.label || h)))),
    el("tbody", {}, rows),
  ]);
}

// ---------- My Team tab ----------

async function renderTeam() {
  const target = document.getElementById("tab-team");
  target.innerHTML = "<div class='card muted'>Loading your roster…</div>";

  const objective = state.objective || "points";
  const data = await api("/api/my-team?objective=" + objective);
  const team = data.team;
  const optimal = data.optimal;
  state.week = data.week;

  const stats = el("div", { class: "row" }, [
    el("div", { class: "stat" }, [
      el("div", { class: "label" }, "Lineup as set"),
      el("div", { class: "value" }, fmt(optimal.current_projected_total, 2)),
    ]),
    el("div", { class: "stat" }, [
      el("div", { class: "label" }, "Optimal lineup"),
      el("div", { class: "value" }, fmt(optimal.projected_total, 2)),
    ]),
    el("div", { class: "stat" }, [
      el("div", { class: "label" }, "Points available"),
      el("div", { class: "value " + (optimal.points_gained > 0.05 ? "good" : "muted") },
        signed(optimal.points_gained)),
    ]),
    el("div", { class: "stat" }, [
      el("div", { class: "label" }, "Record"),
      el("div", { class: "value" }, team.record),
    ]),
  ]);

  // Choose what the lineup is optimized for: raw points, or the chance of
  // beating this week's opponent (which favors upside when you are behind).
  const objectiveSelect = el("select", {
    onchange: e => { state.objective = e.target.value; renderTeam(); },
  }, [
    el("option", { value: "points", selected: objective === "points" ? "selected" : null },
      "Maximize projected points"),
    el("option", { value: "win", selected: objective === "win" ? "selected" : null },
      "Maximize win probability"),
  ]);
  const winNote = optimal.win_probability != null
    ? el("div", { class: "muted" },
        `Win probability: ${fmt(optimal.win_probability * 100, 1)}% ` +
        `(as set: ${fmt(optimal.current_win_probability * 100, 1)}%)`)
    : (objective === "win"
        ? el("div", { class: "muted" }, "No opponent this week; showing the points lineup.")
        : "");

  // Recommended lineup and the moves needed to get there.
  const lineupRows = optimal.lineup.map(row => {
    const player = row.player;
    return el("tr", {}, [
      el("td", {}, el("span", { class: "pos" }, row.slot_name)),
      el("td", {}, player ? player.name : el("span", { class: "muted" }, "(empty)")),
      el("td", { class: "hide-sm" }, player ? player.pro_team : "-"),
      el("td", {}, player ? statusLabel(player) : ""),
      player ? projCell(player, player.effective_projection) : el("td", { class: "num" }, "0.0"),
    ]);
  });

  const moveList = optimal.moves.length
    ? el("ul", {}, optimal.moves.map(m =>
        el("li", {}, `${m.player_name}: ${m.from_slot_name} → ${m.to_slot_name}`)))
    : el("div", { class: "muted" }, "Your lineup is already optimal for this week.");

  const applyButton = el("button", {
    class: "action",
    disabled: optimal.moves.length ? null : "disabled",
    onclick: () => applyLineup(optimal.moves),
  }, optimal.moves.length ? `Apply ${optimal.moves.length} move(s)` : "Nothing to apply");

  const applyResult = el("div", { id: "apply-result" });

  // Full roster, starters first.
  const rosterRows = [...team.roster]
    .sort((a, b) => (b.is_starting - a.is_starting) || (a.lineup_slot - b.lineup_slot))
    .map(player => el("tr", { class: player.is_starting ? "starter" : "bench" }, [
      el("td", {}, el("span", { class: "pos" }, player.lineup_slot_name)),
      el("td", {}, player.name),
      el("td", { class: "hide-sm" }, player.position),
      el("td", { class: "hide-sm" }, player.pro_team),
      el("td", {}, statusLabel(player)),
      projCell(player),
      el("td", { class: "num hide-sm" }, fmt(player.ros_points || player.season_projected_points, 1)),
      el("td", { class: "num hide-sm" }, fmt(player.season_actual_points, 1)),
    ]));

  target.innerHTML = "";
  target.append(
    el("div", { class: "card" }, [
      el("h2", {}, `${team.name} — week ${data.week}`),
      stats,
    ]),
    el("div", { class: "card" }, [
      el("h2", {}, "Recommended lineup"),
      objectiveSelect,
      winNote,
      table([
        "Slot", "Player", { label: "Team", hide: true }, "Status", { label: "Proj", num: true },
      ], lineupRows),
      el("div", { style: "margin-top:14px" }, [
        el("h2", {}, "Changes needed"),
        moveList,
        el("div", { class: "row", style: "margin-top:12px" }, [applyButton]),
        applyResult,
      ]),
    ]),
    el("div", { class: "card" }, [
      el("h2", {}, "Full roster"),
      table([
        "Slot", "Player", { label: "Pos", hide: true }, { label: "Team", hide: true },
        "Status", { label: "Proj", num: true }, { label: "ROS", num: true, hide: true },
        { label: "Season", num: true, hide: true },
      ], rosterRows),
    ]),
  );
}

// Preview first, then submit only after the user confirms the exact moves.
async function applyLineup(moves) {
  const box = document.getElementById("apply-result");
  box.innerHTML = "";

  if (!state.config.can_write) {
    box.append(el("div", { class: "notice err" },
      "Read-only: set ESPN_SWID, ESPN_S2 and ESPN_TEAM_ID in .env to submit moves."));
    return;
  }

  const summary = moves.map(m => `${m.player_name}: ${m.from_slot_name} → ${m.to_slot_name}`).join("\n");
  if (!confirm(`Submit these lineup changes to ESPN?\n\n${summary}`)) return;

  try {
    const result = await api("/api/lineup/apply", {
      method: "POST",
      body: JSON.stringify({ moves: moves.map(m => ({
        player_id: m.player_id, from_slot: m.from_slot, to_slot: m.to_slot,
      })), dry_run: false }),
    });
    box.append(el("div", { class: "notice ok" },
      result.submitted ? "Lineup submitted to ESPN." : (result.reason || "Nothing to do.")));
    if (result.submitted) setTimeout(renderTeam, 800);
  } catch (error) {
    box.append(el("div", { class: "notice err" }, error.message));
  }
}

// ---------- Waivers tab ----------

const WAIVER_PANES = {
  list: ["The List", renderWaiverList],
  rosters: ["Current Rosters", renderWaiverRosters],
  targets: ["My Targets", renderWaiverTargets],
  stash: ["Stash Picks", renderWaiverStash],
};
const waiverLoaded = {};

// Only ever link to plain web addresses, since the text came from the web.
function safeLink(url, label) {
  if (!/^https?:\/\//i.test(url || "")) return el("span", {}, label);
  return el("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, label);
}

function sourceChips(sources) {
  return el("div", { class: "chips" }, sources.map(s => el("span", {
    class: "chip " + (s.ok ? "ok" : "off"),
    title: s.note || (s.ok ? `${s.count} found` : "Unavailable"),
  }, `${s.source} · ${s.ok ? s.count : "down"}`)));
}

async function renderWaivers() {
  const target = document.getElementById("tab-waivers");
  target.innerHTML = "";

  const bar = el("div", { class: "subtabs" }, Object.entries(WAIVER_PANES).map(([key, [label]]) =>
    el("button", { "data-sub": key, onclick: () => selectWaiverPane(key) }, label)));
  target.append(bar);
  for (const key of Object.keys(WAIVER_PANES)) {
    target.append(el("div", { id: `waiver-${key}`, class: "hidden" }));
  }
  await selectWaiverPane("targets");
}

async function selectWaiverPane(key) {
  document.querySelectorAll(".subtabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.sub === key));
  for (const name of Object.keys(WAIVER_PANES)) {
    document.getElementById(`waiver-${name}`).classList.toggle("hidden", name !== key);
  }
  if (waiverLoaded[key]) return;

  const pane = document.getElementById(`waiver-${key}`);
  pane.innerHTML = "<div class='card muted'>Reading the web and your league. The first load can take a few seconds…</div>";
  try {
    clearError();
    await WAIVER_PANES[key][1](pane);
    waiverLoaded[key] = true;
  } catch (error) {
    pane.innerHTML = "";
    showError(error.message);
  }
}

// Sub-tab 1: the consensus list from the web.
async function renderWaiverList(pane) {
  const data = await api("/api/waivers/consensus");

  const rows = data.players.slice(0, 60).map(entry => {
    const p = entry.player;
    const notes = entry.notes.map(n => el("div", { class: "muted note" }, `${n.source}: “${n.text}”`));
    const links = entry.articles.slice(0, 3).map(a => el("div", { style: "font-size:12px" }, [safeLink(a.url, a.source)]));
    return el("tr", {}, [
      el("td", { class: "num" }, String(entry.rank)),
      el("td", {}, [el("div", {}, p.name), el("div", { class: "muted", style: "font-size:12px" },
        `${p.position} · ${p.pro_team} · ${fmt(p.percent_owned, 0)}% owned`)]),
      el("td", { class: "num" }, fmt(entry.score, 1)),
      el("td", { class: "num" }, String(entry.source_count)),
      el("td", { class: "hide-sm" }, entry.trending_rank ? `#${entry.trending_rank} (${entry.trending_adds.toLocaleString()} adds)` : "—"),
      el("td", { class: "hide-sm" }, [...notes.slice(0, 1), ...links]),
    ]);
  });

  pane.innerHTML = "";
  pane.append(
    el("div", { class: "card" }, [
      el("h2", {}, "Where the data comes from"),
      sourceChips(data.sources),
      el("div", { class: "muted", style: "margin-top:8px" },
        "The Athletic is paywalled, so only its public headlines and summaries are read. " +
        "Names are matched against players actually available in your league."),
      el("button", { class: "ghost small", style: "margin-top:10px", onclick: async () => {
        waiverLoaded.list = false; waiverLoaded.targets = false;
        await api("/api/waivers/consensus?refresh=true");
        await selectWaiverPane("list");
      } }, "Refresh from the web"),
    ]),
    el("div", { class: "card" }, [
      el("h2", {}, "Top waiver targets across the web"),
      table(["#", "Player", { label: "Score", num: true }, { label: "Sources", num: true },
        { label: "Sleeper", hide: true }, { label: "What they said", hide: true }], rows),
    ]),
  );
}

// Sub-tab 2: every team's roster, what it lacks, and its budget.
async function renderWaiverRosters(pane) {
  const data = await api("/api/waivers/rosters");

  const select = el("select", {}, data.teams.map(t => el("option", {
    value: t.team_id, selected: t.team_id === data.my_team_id ? "selected" : null,
  }, t.name)));

  const summary = data.teams.map(t => el("tr", {}, [
    el("td", {}, t.name + (t.team_id === data.my_team_id ? " (you)" : "")),
    el("td", { class: "num" }, `$${fmt(t.faab_remaining, 0)}`),
    el("td", { class: "hide-sm" }, t.waiver_priority ? `#${t.waiver_priority}` : "—"),
    el("td", {}, t.needs.length ? t.needs.join(", ") : "—"),
  ]));

  const detail = el("div", { id: "waiver-roster-detail" });

  async function show(teamId) {
    const team = data.teams.find(t => t.team_id === Number(teamId));
    const rows = [...team.roster]

async function submitClaim(player, dropSelect, bidInput, usesFaab) {
  const box = document.getElementById("claim-result");
  box.innerHTML = "";

  if (!state.config.can_write) {
    box.append(el("div", { class: "notice err" },
      "Read-only: set ESPN_SWID, ESPN_S2 and ESPN_TEAM_ID in .env to submit claims."));
    return;
  }

  const dropId = dropSelect.value ? Number(dropSelect.value) : null;

  // A player past the waiver period is a free agent: ESPN adds them at once
  // and rejects a waiver claim for them. Only waiver players take a bid.
  const isWaiver = player.availability === "WAIVERS";
  const bid = usesFaab && isWaiver ? Number(bidInput.value || 0) : null;

  const lines = [`Add: ${player.name}${isWaiver ? "" : " (free agent, added immediately)"}`];
  if (dropId) {
    const label = dropSelect.options[dropSelect.selectedIndex].textContent;
    lines.push(`Drop: ${label}`);
  }
  if (bid !== null) lines.push(`Bid: $${bid}`);
  if (!confirm(`${isWaiver ? "Submit this waiver claim to ESPN?" : "Add this free agent on ESPN now?"}\n\n${lines.join("\n")}`)) return;

  try {
    const result = await api("/api/waivers/claim", {
      method: "POST",
      body: JSON.stringify({
        add_player_id: player.player_id,
        drop_player_id: dropId,
        bid_amount: bid,
        is_waiver: isWaiver,
        dry_run: false,
      }),
    });
    box.append(el("div", { class: "notice ok" },
      result.submitted ? (isWaiver ? `Claim submitted for ${player.name}.` : `${player.name} added.`) : "Not submitted."));
  } catch (error) {
    box.append(el("div", { class: "notice err" }, error.message));
  }
}

// Openings the news watcher found. Nothing is ever claimed for you: the Add
// button shows exactly what it will send to ESPN and asks first.
async function claimFromNews(event, box) {
  box.innerHTML = "";
  if (!state.config.can_write) {
    box.append(el("div", { class: "notice err" },
      "Read-only: set ESPN_SWID, ESPN_S2 and ESPN_TEAM_ID in .env to submit claims."));
    return;
  }
  const isWaiver = event.candidate_availability === "WAIVERS";
  const lines = [`Add: ${event.candidate_name}${isWaiver ? "" : " (free agent, added immediately)"}`];
  if (event.drop_name) lines.push(`Drop: ${event.drop_name}`);
  if (isWaiver && event.bid) lines.push(`Bid: $${Math.round(event.bid)}`);
  if (!confirm(`${isWaiver ? "Submit this waiver claim to ESPN?" : "Add this free agent on ESPN now?"}\n\n${lines.join("\n")}`)) return;
  try {
    const result = await api("/api/waivers/claim", {
      method: "POST",
      body: JSON.stringify({
        add_player_id: event.candidate_id,
        drop_player_id: event.drop_id,
        bid_amount: isWaiver ? Math.round(event.bid || 0) : null,
        is_waiver: isWaiver,
        dry_run: false,
      }),
    });
    box.append(el("div", { class: "notice ok" },
      result.submitted ? `${isWaiver ? "Claim submitted for" : "Added"} ${event.candidate_name}.` : "Not submitted."));
  } catch (error) {
    box.append(el("div", { class: "notice err" }, error.message));
  }
}

// Undervalued players: where our model disagrees with the experts (sized
// as expected points of edge from the backtest), and where the other
// sources rate a player well above ESPN, which the rest of the league sees.
async function renderValue() {
  const target = document.getElementById("tab-value");
  target.innerHTML = "<div class='card muted'>Loading projections…</div>";
  const data = await api("/api/projections/value");

  const edgeRows = lines => lines.map(row => el("tr", {}, [
    el("td", {}, row.name),
    el("td", {}, el("span", { class: "pos" }, row.position)),
    el("td", { class: "hide-sm" }, row.pro_team),
    el("td", { class: "num" }, fmt(row.experts, 1)),
    el("td", { class: "num" }, fmt(row.model, 1)),
    el("td", { class: "num " + (row.expected_edge >= 0 ? "good" : "bad") }, signed(row.expected_edge, 1)),
  ]));
  const edgeHeaders = ["Player", "Pos", { label: "Team", hide: true },
    { label: "Experts", num: true }, { label: "Model", num: true }, { label: "Edge", num: true }];

  const espnRows = data.espn_behind.map(row => el("tr", {}, [
    el("td", {}, row.name),
    el("td", {}, el("span", { class: "pos" }, row.position)),
    el("td", { class: "hide-sm" }, row.pro_team),
    el("td", { class: "num" }, fmt(row.espn, 1)),
    el("td", { class: "num" }, fmt(row.others, 1)),
    el("td", { class: "num good" }, signed(row.gap_vs_espn, 1)),
  ]));

  const bt = data.backtest;
  const note = bt.slopes && Object.keys(bt.slopes).length
    ? `Edge is expected points above the experts' number. Backtested ${bt.seasons[0]}–${bt.seasons[bt.seasons.length - 1]}: ` +
      `about ${fmt(100 * (bt.slopes.WR || 0), 0)}% of the model's disagreement came true.`
    : "No backtest results yet. Run `python -m ffopt backtest` to size the model's edge.";

  const card = (title, subtitle, headers, rows) => el("div", { class: "card" }, [
    el("h2", {}, title),
    el("div", { class: "muted", style: "margin-bottom:10px" }, subtitle),
    rows.length ? table(headers, rows) : el("div", { class: "muted" }, "Nothing this week."),
  ]);

  target.innerHTML = "";
  target.append(
    card(`Week ${data.week}: pickups our model likes`, note, edgeHeaders, edgeRows(data.model_pickups)),
    card("Pickups the other sources rate above ESPN",
      "Your leaguemates see ESPN's number, so these are the easiest to get.",
      ["Player", "Pos", { label: "Team", hide: true }, { label: "ESPN", num: true },
        { label: "Others", num: true }, { label: "Gap", num: true }], espnRows),
    card("Your players the model is worried about", "Consider benching or selling.",
      edgeHeaders, edgeRows(data.roster_warnings)),
    card("Your players the model likes", "Start with more confidence.",
      edgeHeaders, edgeRows(data.roster_boosts)),
  );
}

  const teamParam = dashState.teamId ? `?team_id=${dashState.teamId}` : "";
  const data = await api(`/api/dashboard/season${teamParam}`);
  dashState.teamId = data.team.team_id;
  if (!dashState.week) dashState.week = data.current_week;
  const detail = el("div", { id: "matchup-detail" });

  const teamSelect = el("select", {
    onchange: e => { dashState.teamId = Number(e.target.value); dashState.week = null; renderSeason(); },
  }, data.teams.map(t => el("option", {
    value: t.team_id, selected: t.team_id === data.team.team_id ? "selected" : null }, t.name)));

  const futureWeeks = data.weeks.filter(w => !w.played).map(w => w.week);
  const weekSelect = el("select", {
    onchange: e => { dashState.week = Number(e.target.value); highlight(); showMatchup(dashState.week, detail); },
  }, futureWeeks.map(w => el("option", { value: w, selected: w === dashState.week ? "selected" : null },
    `Week ${w}${w === data.current_week ? " (this week)" : ""}`)));

  const rowsByWeek = {};
  const rows = data.weeks.map(w => {
    const result = w.played
      ? el("span", { class: w.my_score > w.their_score ? "good" : "bad" },
          `${w.my_score > w.their_score ? "W" : "L"} ${fmt(w.my_score, 1)}–${fmt(w.their_score, 1)}`)
      : `${fmt(w.my_projection, 1)}–${fmt(w.their_projection, 1)}`;
    const row = el("tr", {
      class: "week-row" + (w.played ? "" : " clickable"),
      onclick: w.played ? null : () => {
        dashState.week = w.week; weekSelect.value = w.week; highlight(); showMatchup(w.week, detail);
      },
    }, [
      el("td", {}, `Week ${w.week}`),
      el("td", {}, w.opponent || el("span", { class: "muted" }, "—")),
      el("td", { class: "num" }, result),
      w.played ? el("td", { class: "num muted" }, "final") : winCell(w.win_probability),
    ]);
    rowsByWeek[w.week] = row;
    return row;
  });
  function highlight() {
    Object.entries(rowsByWeek).forEach(([week, row]) =>
      row.classList.toggle("selected", Number(week) === dashState.week));
  }

  // Week over week: your score or projection against your opponent's.
  const mine = {}, theirs = {};
  data.weeks.forEach(w => {
    mine[w.week] = w.played ? w.my_score : w.my_projection;
    theirs[w.week] = w.played ? w.their_score : w.their_projection;
  });
  const chart = weeklyChart(data.weeks.map(w => w.week), [
    { key: "mine", label: `${data.team.name} (scores, then projections)`, color: "var(--series-1)", values: mine },
    { key: "theirs", label: "Opponent that week", color: "var(--series-2)", values: theirs },
  ]);

  target.innerHTML = "";
  target.append(
    el("div", { class: "card" }, [
      el("h2", {}, `${data.team.name} (${data.team.record}): season`),
      el("div", { class: "row", style: "gap:10px;margin-bottom:12px" }, [teamSelect, weekSelect]),
      chart,
      table(["Week", "Opponent", { label: "Score / projection", num: true }, { label: "Win", num: true }], rows),
    ]),
    detail,
  );
  highlight();
  await showMatchup(dashState.week, detail);
}

async function showPlayerOutlook(playerId, target) {
  target.innerHTML = "<div class='card muted'>Loading player…</div>";
  const data = await api(`/api/players/${playerId}/outlook`);

  const pastBlend = r => r.consensus != null ? r.consensus : r.experts_blend;
  const weeks = [...data.past.map(r => r.week), ...data.future.map(r => r.week)];
  const projection = {}, actual = {}, espn = {}, model = {};
  data.past.forEach(r => {
    if (pastBlend(r) != null) projection[r.week] = pastBlend(r);
    if (r.actual != null) actual[r.week] = r.actual;
    if (r.espn != null) espn[r.week] = r.espn;
    if (r.model != null) model[r.week] = r.model;
  });
  data.future.forEach(r => {
    if (r.on_bye) return;
    projection[r.week] = r.projection;
    if (r.sources.espn != null) espn[r.week] = r.sources.espn;
    if (r.sources.model != null) model[r.week] = r.sources.model;
  });
  const series = [
    { key: "blend", label: "Projection (blend)", color: "var(--series-1)", values: projection },
    { key: "actual", label: "Actual", color: "var(--series-2)", values: actual, dots: true },
    { key: "espn", label: "ESPN", color: "var(--series-3)", values: espn },
    { key: "model", label: "Our model", color: "var(--series-4)", values: model },
  ].filter(s => Object.keys(s.values).length);

  const cell = v => el("td", { class: "num" }, v == null ? "–" : fmt(v, 1));
  const rows = [
    ...data.past.map(r => el("tr", { class: "bench" }, [
      el("td", {}, `Week ${r.week}`), el("td", { class: "hide-sm muted" }, "played"),
      cell(r.espn), cell(r.sleeper), cell(r.fantasypros), cell(r.model), cell(pastBlend(r)), cell(r.actual),
    ])),
    ...data.future.map(r => el("tr", {}, [
      el("td", {}, `Week ${r.week}`),
      el("td", { class: "hide-sm" }, r.on_bye ? el("span", { class: "warn" }, "BYE") : r.game),
      cell(r.sources.espn), cell(r.sources.sleeper), cell(r.sources.fantasypros), cell(r.sources.model),
      el("td", { class: "num" }, el("b", {}, fmt(r.projection, 1))), cell(null),
    ])),
  ];

  const names = { espn: "ESPN", sleeper: "Sleeper", fantasypros: "FantasyPros", model: "Our model" };
  const chips = Object.entries(data.ros_sources).map(([s, v]) =>
    el("span", { class: "chip" }, [`${names[s] || s} `, el("b", {}, fmt(v, 1))]));

  target.innerHTML = "";
  target.append(el("div", { class: "card" }, [
    el("h2", {}, `${data.name} · ${data.position} ${data.pro_team}`),
    el("div", { class: "muted" },
      `${data.owner ? "Rostered by " + data.owner : "Available"} · ${fmt(data.percent_owned, 1)}% owned` +
      (data.injury_status && data.injury_status !== "Active" ? ` · ${data.injury_status}` : "")),
    el("div", { class: "row", style: "margin-top:12px" }, [
      el("div", { class: "stat" }, [el("div", { class: "label" }, "This week"),
        el("div", { class: "value" }, fmt(data.future[0] ? data.future[0].projection : 0, 1))]),
      el("div", { class: "stat" }, [el("div", { class: "label" }, "Next week"),
        el("div", { class: "value" }, fmt(data.future[1] ? data.future[1].projection : 0, 1))]),
      el("div", { class: "stat" }, [el("div", { class: "label" }, `Rest of season (${data.ros_games} games)`),
        el("div", { class: "value" }, fmt(data.ros_points, 1))]),
    ]),
    el("div", { class: "chips" }, [el("span", { class: "chip" }, "ROS by source:"), ...chips]),
    weeks.length ? weeklyChart(weeks, series) : "",
    table(["Week", { label: "Game", hide: true }, { label: "ESPN", num: true }, { label: "Sleeper", num: true },
      { label: "FantasyPros", num: true }, { label: "Model", num: true }, { label: "Projection", num: true },
      { label: "Actual", num: true }], rows),
    el("div", { class: "muted", style: "margin-top:10px;font-size:12px" },
      "Future weeks blend ESPN and Sleeper; FantasyPros only projects this week. Our model is shown but not blended past this week."),
  ]));
}

// A line chart of weekly points: one line per series, markers for actual
// scores, a crosshair that snaps to the week, and one tooltip listing every
// series. `series` is [{key, label, color, values: {week: points}, dots}].
function weeklyChart(weeks, series) {
  const W = 900, H = 280, pad = { l: 36, r: 16, t: 12, b: 28 };
  const ns = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => {
    const node = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    return node;
  };
  const all = series.flatMap(s => weeks.map(w => s.values[w]).filter(v => v != null));
  const top = Math.max(10, Math.ceil(Math.max(...all, 0) / 5) * 5);
  const x = w => pad.l + (weeks.length === 1 ? (W - pad.l - pad.r) / 2
    : (weeks.indexOf(w) / (weeks.length - 1)) * (W - pad.l - pad.r));
  const y = v => pad.t + (1 - v / top) * (H - pad.t - pad.b);

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Weekly projections and actual points" });
  for (let v = 0; v <= top; v += top / 5) {
    svg.append(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v),
      stroke: "var(--grid)", "stroke-width": 1 }));
    const label = svgEl("text", { x: pad.l - 6, y: y(v) + 4, "text-anchor": "end",
      "font-size": 11, fill: "var(--muted)" });
    label.textContent = Math.round(v);
    svg.append(label);
  }
  weeks.forEach(w => {
    const label = svgEl("text", { x: x(w), y: H - 8, "text-anchor": "middle",
      "font-size": 11, fill: "var(--muted)" });
    label.textContent = `Wk ${w}`;
    svg.append(label);
  });

  for (const s of series) {
    const points = weeks.filter(w => s.values[w] != null).map(w => [x(w), y(s.values[w])]);
    // A week with no value (a bye) breaks the line rather than bridging it.
    if (!s.dots) {
      let run = [];
      const flush = () => {
        if (run.length > 1) {
          svg.append(svgEl("polyline", { points: run.map(p => p.join(",")).join(" "),
            fill: "none", stroke: s.color, "stroke-width": 2,
            "stroke-linejoin": "round", "stroke-linecap": "round" }));
        }
        run = [];
      };
      weeks.forEach(w => s.values[w] == null ? flush() : run.push([x(w), y(s.values[w])]));
      flush();
    }
    for (const [px, py] of points) {
      svg.append(svgEl("circle", { cx: px, cy: py, r: s.dots ? 5 : 3.5, fill: s.color,
        stroke: "var(--panel)", "stroke-width": 2 }));
    }
  }

  // Crosshair and tooltip.
  const cross = svgEl("line", { y1: pad.t, y2: H - pad.b, stroke: "var(--muted)",
    "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const wrap = el("div", { style: "position:relative" }, [svg]);
  const tip = el("div", { class: "viz-tip", style: "display:none" });
  wrap.append(tip);
  const hit = svgEl("rect", { x: pad.l - 10, y: 0, width: W - pad.l - pad.r + 20, height: H,
    fill: "transparent" });
  svg.append(hit);
  hit.addEventListener("pointermove", event => {
    const box = svg.getBoundingClientRect();
    const px = (event.clientX - box.left) * (W / box.width);
    const week = weeks.reduce((best, w) => Math.abs(x(w) - px) < Math.abs(x(best) - px) ? w : best, weeks[0]);
    cross.setAttribute("x1", x(week)); cross.setAttribute("x2", x(week));
    cross.setAttribute("visibility", "visible");
    tip.innerHTML = "";
    tip.append(el("div", { style: "font-weight:600;margin-bottom:4px" }, `Week ${week}`));
    for (const s of series) {
      const v = s.values[week];
      tip.append(el("div", { class: "row" }, [
        el("span", {}, [el("span", { class: "dot", style: `display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:${s.color}` }), s.label]),
        el("span", {}, v == null ? "–" : fmt(v, 1)),
      ]));
    }
    tip.style.display = "block";
    const left = (x(week) / W) * box.width;
    tip.style.left = `${Math.min(left + 12, box.width - 160)}px`;
    tip.style.top = "8px";
  });
  hit.addEventListener("pointerleave", () => {
    cross.setAttribute("visibility", "hidden");
    tip.style.display = "none";
  });

  const legend = el("div", { class: "viz-legend" }, series.map(s => el("span", {}, [
    el("span", { class: s.dots ? "dot" : "key", style: `background:${s.color}` }), s.label,
  ])));
  return el("div", { class: "viz-root" }, [legend, wrap]);
}

async function showPlayerTrend(playerId, target) {
  target.innerHTML = "<div class='card muted'>Loading history…</div>";
  const data = await api(`/api/projections/trends/${encodeURIComponent(playerId)}`);
  const weeks = data.weeks.map(r => r.week);
  const pick = key => Object.fromEntries(data.weeks.filter(r => r[key] != null).map(r => [r.week, r[key]]));
  const blendValues = Object.fromEntries(data.weeks
    .map(r => [r.week, r.consensus != null ? r.consensus : r.experts_blend])
    .filter(([, v]) => v != null));
  const series = [
    { key: "blend", label: "Projection (blend)", color: "var(--series-1)", values: blendValues },
    { key: "actual", label: "Actual", color: "var(--series-2)", values: pick("actual"), dots: true },
    { key: "espn", label: "ESPN", color: "var(--series-3)", values: pick("espn") },
    { key: "model", label: "Our model", color: "var(--series-4)", values: pick("model") },
  ].filter(s => Object.keys(s.values).length);

  const sources = ["espn", "sleeper", "fantasypros", "model", "consensus", "actual"];
  const names = { espn: "ESPN", sleeper: "Sleeper", fantasypros: "FantasyPros", model: "Model",
    consensus: "Blend", actual: "Actual" };
  const weekRows = data.weeks.map(r => el("tr", {}, [
    el("td", {}, `Week ${r.week}`),
    ...sources.map(s => el("td", { class: "num" }, r[s] == null ? "–" : fmt(r[s], 1))),
  ]));

  const rosNames = Object.keys(data.ros);
  const days = [...new Set(rosNames.flatMap(s => data.ros[s].map(p => p.date)))].sort();
  const rosRows = days.map(day => el("tr", {}, [
    el("td", {}, day),
    ...rosNames.map(s => {
      const point = data.ros[s].find(p => p.date === day);
      return el("td", { class: "num" }, point ? fmt(point.points, 1) : "–");
    }),
  ]));

  target.innerHTML = "";
  target.append(el("div", { class: "card" }, [
    el("h2", {}, `${data.name || "Player"} · ${data.position || ""} ${data.team || ""}`),
    weeks.length ? weeklyChart(weeks, series) : el("div", { class: "muted" }, "No weekly history yet."),
    table(["Week", ...sources.map(s => ({ label: names[s], num: true }))], weekRows),
    el("h2", { style: "margin-top:18px" }, "Rest of season, by day pulled"),
    days.length
      ? table(["Date", ...rosNames.map(s => ({ label: names[s] || s, num: true }))], rosRows)
      : el("div", { class: "muted" }, "Rest-of-season history starts with the first archived pull."),
  ]));
}

  target.innerHTML = "";

        "Click any player, or search, to see his projections by source week by week."),
      search, options,
    ]),
    detail,
    moverCard("Your players: weekly projection moves",
      "This week's projection against his earlier weeks.",
      [...data.my_team.weekly.risers, ...data.my_team.weekly.fallers]),
    moverCard("Weekly risers", "Projected well above his earlier weeks: a new role, a return, or a matchup.",
      data.weekly.risers),
    moverCard("Weekly fallers", "Projected well below his earlier weeks.", data.weekly.fallers),
    moverCard("Rest-of-season risers", rosNote, data.ros.risers),
    moverCard("Rest-of-season fallers", rosNote, data.ros.fallers),
  );
}

async function renderScout() {
  const target = document.getElementById("tab-scout");
  target.innerHTML = "<div class='card muted'>Scouting your opponent…</div>";

  const report = await api("/api/scouting/opponent");
  target.innerHTML = "";

  if (!report.has_opponent) {
    target.append(el("div", { class: "card muted" }, report.message || "No opponent this week."));
    return;
  }

  const winPct = Math.round(report.win_probability_if_optimal * 100);

  const stats = el("div", { class: "row" }, [
    el("div", { class: "stat" }, [
      el("div", { class: "label" }, "Your best lineup"),
      el("div", { class: "value" }, fmt(report.my_projected_best, 1)),
    ]),
    el("div", { class: "stat" }, [
      el("div", { class: "label" }, "Their lineup as set"),
      el("div", { class: "value" }, fmt(report.their_projected_current, 1)),
    ]),
    el("div", { class: "stat" }, [
      el("div", { class: "label" }, "Projected margin"),
      el("div", { class: "value " + (report.projected_margin >= 0 ? "good" : "bad") },
        signed(report.projected_margin, 1)),
    ]),
    el("div", { class: "stat" }, [
      el("div", { class: "label" }, "Win probability"),
      el("div", { class: "value" }, `${winPct}%`),
      el("div", { class: "bar" }, el("span", { style: `width:${winPct}%` })),
    ]),
  ]);

  const edgeRows = report.positional_edges.map(row => el("tr", {}, [
    el("td", {}, el("span", { class: "pos" }, row.slot_name)),
    el("td", { class: "num" }, fmt(row.my_points, 1)),
    el("td", { class: "num" }, fmt(row.their_points, 1)),
    el("td", { class: "num " + (row.edge >= 0 ? "good" : "bad") }, signed(row.edge, 1)),
  ]));

  const starterRows = report.their_starters.map(player => el("tr", {}, [
    el("td", {}, el("span", { class: "pos" }, player.lineup_slot_name)),
    el("td", {}, player.name),
    el("td", { class: "hide-sm" }, player.pro_team),
    el("td", {}, statusLabel(player)),
    projCell(player),
  ]));

  target.append(
    el("div", { class: "card" }, [
      el("h2", {}, `Week ${report.week} vs ${report.opponent.name} (${report.opponent.record})`),
      stats,
      el("div", { class: "muted", style: "margin-top:10px" },
        `They are leaving ${fmt(report.their_lineup_efficiency.points_left_on_bench, 1)} points on their bench. ` +
        `Their ceiling if they fix it is ${fmt(report.their_projected_best, 1)}.`),
    ]),
    el("div", { class: "card" }, [
      el("h2", {}, "Position by position"),
      table(["Slot", { label: "You", num: true }, { label: "Them", num: true }, { label: "Edge", num: true }], edgeRows),
    ]),
    report.their_risks.length ? el("div", { class: "card" }, [
      el("h2", {}, "Their questionable starters"),
      el("ul", {}, report.their_risks.map(p =>
        el("li", {}, `${p.name} (${p.position}) — ${p.on_bye ? "on bye" : p.injury_status}`))),
    ]) : null,
    el("div", { class: "card" }, [
      el("h2", {}, "Their starting lineup"),
      table(["Slot", "Player", { label: "Team", hide: true }, "Status", { label: "Proj", num: true }], starterRows),
    ]),
  );
}

// ---------- League tab ----------

async function renderLeague() {
  const target = document.getElementById("tab-league");
  target.innerHTML = "<div class='card muted'>Ranking the league…</div>";

  const [rankings, trades] = await Promise.all([
    api("/api/scouting/power-rankings"),
    api("/api/scouting/trade-targets"),
  ]);

  const rankRows = rankings.rankings.map(row => {
    const team = row.team;
    return el("tr", {}, [
      el("td", { class: "num" }, String(row.power_rank)),
      el("td", {}, [
        el("div", {}, team.name),
        el("div", { class: "muted", style: "font-size:12px" },
          team.owner_names.join(", ") || `Team ${team.team_id}`),
      ]),
      el("td", {}, team.record),
      el("td", { class: "num hide-sm" }, fmt(row.points_per_game, 1)),
      el("td", { class: "num" }, fmt(row.roster_strength_this_week, 1)),
      el("td", { class: "num hide-sm" }, fmt(row.efficiency.points_left_on_bench, 1)),
      el("td", { class: "num" }, fmt(row.power_score, 1)),
      el("td", {}, el("button", { class: "action ghost small",
        onclick: () => showRoster(team.team_id, team.name) }, "Roster")),
    ]);
  });

  const tradeCards = trades.targets.map(entry => el("div", { class: "card" }, [
    el("h2", {}, `${entry.team.name} (${entry.team.record})`),
    el("div", { class: "muted", style: "margin-bottom:8px" },
      `They are deep at: ${entry.their_surplus_positions.join(", ") || "nothing in particular"}`),
    el("div", { style: "font-weight:600;margin-bottom:4px" }, "Ask for"),
    el("ul", {}, entry.players.map(match => el("li", {}, [
      `${match.player.name} (${match.player.position}, ${match.player.pro_team}` +
      `${match.is_their_starter ? ", their starter" : ", on their bench"}) — ` +
      `worth ${signed(match.weekly_gain_for_me)} to your lineup`,
      match.they_can_spare ? el("span", { class: "good" }, " · they can spare it") : null,
    ]))),
    entry.could_offer.length ? el("div", { style: "font-weight:600;margin:10px 0 4px" }, "Could offer") : null,
    entry.could_offer.length ? el("ul", {}, entry.could_offer.map(offer => el("li", {},
      `${offer.player.name} (${offer.player.position}, ${offer.player.pro_team}) — ` +
      `worth ${signed(offer.weekly_gain_for_them)} to them`))) : null,
  ]));

  target.innerHTML = "";
  target.append(
    el("div", { class: "card" }, [
      el("h2", {}, `Power rankings — week ${rankings.week}`),
      table(["#", "Team", "Rec", { label: "PPG", num: true, hide: true },
        { label: "Best now", num: true }, { label: "On bench", num: true, hide: true },
        { label: "Power", num: true }, ""], rankRows),
    ]),
    el("div", { id: "roster-panel" }),
    el("div", { class: "card" }, [
      el("h2", {}, "Trade targets"),
      el("div", { class: "muted" },
        trades.targets.length ? "Players on other rosters who would improve your starting lineup."
                              : "No clear trade targets right now."),
    ]),
    ...tradeCards,
  );
}

async function showRoster(teamId, teamName) {
  const panel = document.getElementById("roster-panel");
  panel.innerHTML = "<div class='card muted'>Loading roster…</div>";

  const data = await api(`/api/teams/${teamId}`);
  const rows = [...data.team.roster]
    .sort((a, b) => (b.is_starting - a.is_starting) || (a.lineup_slot - b.lineup_slot))
    .map(player => el("tr", { class: player.is_starting ? "starter" : "bench" }, [
      el("td", {}, el("span", { class: "pos" }, player.lineup_slot_name)),
      el("td", {}, player.name),
      el("td", { class: "hide-sm" }, player.position),
      el("td", { class: "hide-sm" }, player.pro_team),
      el("td", {}, statusLabel(player)),
      projCell(player),
    ]));

  panel.innerHTML = "";
  panel.append(el("div", { class: "card" }, [
    el("h2", {}, `${teamName} roster`),
    el("div", { class: "muted", style: "margin-bottom:10px" },
      `Starting ${fmt(data.lineup_efficiency.current_projected, 1)}, ` +
      `best available ${fmt(data.lineup_efficiency.best_projected, 1)}.`),
    table(["Slot", "Player", { label: "Pos", hide: true }, { label: "Team", hide: true },
      "Status", { label: "Proj", num: true }], rows),
  ]));
}

// ---------- Bootstrap ----------

const RENDERERS = {
  team: renderTeam, season: renderSeason, players: renderPlayers,
  waivers: renderWaivers, news: renderNews, value: renderValue, trends: renderTrends,
  scout: renderScout, league: renderLeague,
};
const loaded = {};

async function selectTab(name) {
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll("main section").forEach(s =>
    s.classList.toggle("hidden", s.id !== `tab-${name}`));

  if (loaded[name]) return;
  try {
    clearError();
    await RENDERERS[name]();
    loaded[name] = true;
  } catch (error) {
    document.getElementById(`tab-${name}`).innerHTML = "";
    showError(error.message);
  }
}

document.querySelectorAll("nav button").forEach(button =>
  button.addEventListener("click", () => selectTab(button.dataset.tab)));

async function start() {
  try {
    state.config = await api("/api/config");
    if (state.config.missing_fields && state.config.missing_fields.length) {
      showError("League is not configured yet. Set " +
        state.config.missing_fields.join(" and ") + " in your .env file, then reload.");
      document.getElementById("league-sub").textContent = "Not configured";
      return;
    }

    state.league = await api("/api/league");
    document.getElementById("league-name").textContent = state.league.settings.name;
    const s = state.league.settings;
    document.getElementById("league-sub").textContent =
      `Week ${state.league.week} · ${s.size} teams · ${s.scoring_type}` +
      (state.config.can_write ? "" : " · read-only");

    await selectTab("team");
  } catch (error) {
    showError(error.message);
  }
}

start();
</script>
